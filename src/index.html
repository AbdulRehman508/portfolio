<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Abdul Rehman — Software Engineer &amp; Sr. Angular Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Abdul Rehman — Software Engineer and Sr. Angular Developer building fast, scalable enterprise web applications with Angular, TypeScript, NgRx and NestJS.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <script>
    // Apply the saved theme before first paint so there is no flash of the wrong scheme.
    (function () {
      try {
        var stored = localStorage.getItem('ar-portfolio-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* keep the dark default */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
