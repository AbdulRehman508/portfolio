name: Deploy portfolio to GitHub Pages

# Manual only: the live site is deployed by Vercel. Enable Pages
# (Settings -> Pages -> Source: GitHub Actions) before running this.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site lives under /portfolio/ on github.io, so the base href must match.
      - run: npx ng build --base-href /portfolio/

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/codex-admin/browser/index.html dist/codex-admin/browser/404.html
          touch dist/codex-admin/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/codex-admin/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
